name: Settle crank

# Hourly: settle every pledge that ended over an hour ago, so no stake waits on an
# owner who forgot. The crank key only pays fees; refunds go to each pledge's owner.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: crank
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node cli/crank.mjs
        env:
          CRANK_KEYPAIR: ${{ secrets.CRANK_KEYPAIR }}
          RPC_URL: ${{ secrets.RPC_URL }}
